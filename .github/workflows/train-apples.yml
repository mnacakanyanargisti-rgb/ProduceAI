name: Train apple classifier (manual)
on:
  push:
    paths:
      - '.github/workflows/train-apples.yml'
      - 'ml/fetch_apples.py'
      - 'ml/split.py'
      - 'docs/TRAIN_REAL_MODEL.md'
      - 'ml/fetch_github_apples.py'
      - 'ml/fetch_non_apples.py'
      - 'ml/fetch_orchard_apples.py'
      - 'ml/evaluate_orchard.py'
      - 'ml/models.py'
      - 'ml/inference.py'
      - 'ml/train.py'
      - 'ml/evaluate.py'
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of MobileNetV2 epochs"
        required: true
        default: "12"
        type: choice
        options: ["4", "8", "12"]
concurrency:
  group: apple-orchard-training-main
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "datasets>=3,<5"
      - name: Import fresh and rotten apple images
        run: python -m ml.fetch_github_apples --output data/apples --per-class 180
      - name: Download cigarette, candy, grocery and fruit hard negatives
        run: python -m ml.fetch_non_apples --output data/apples --workers 10
      - name: Import orchard apples and isolated independent orchard test
        run: python -m ml.fetch_orchard_apples --output data/apples --external-test data/orchard_test --train-per-class 350 --test-per-class 90 --workers 12
      - name: Freeze stratified manifest
        run: |
          python -m ml.split --data data/apples --source "Bangkit-JKT2-D/fruits-fresh-rotten-classification; mustafa20999/AFQC academic-only; LoaferCH/dataset_classification_cigarettes; PerceptiLabs/Recognizing-Groceries" --license "Unverified - research only pending license confirmation"
      - name: Train MobileNetV2
        run: python -m ml.train --manifest data/manifest.csv --model mobilenet --epochs "${EPOCHS}" --batch-size 16 --version apples-orchard-v3 --output models
        env:
          EPOCHS: ${{ inputs.epochs || '12' }}
      - name: Evaluate on untouched split
        run: python -m ml.evaluate --manifest data/manifest.csv --checkpoint models/mobilenet.pt --output experiments/results.json
      - name: Evaluate independently photographed orchard apples
        run: python -m ml.evaluate_orchard --data data/orchard_test --manifest data/manifest.csv --checkpoint models/mobilenet.pt --metrics experiments/results.json
      - name: Upload checkpoint and metrics (private workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apple-mobilenet-checkpoint-and-metrics
          path: |
            models/mobilenet.pt
            models/mobilenet.metadata.json
            experiments/
          retention-days: 14
