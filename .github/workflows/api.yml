name: API tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi python-multipart pillow pytest httpx
      - run: python -m pytest backend/tests -q
      - run: python -m compileall -q backend ml
